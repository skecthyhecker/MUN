<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery — NAVDOOT 1.0</title>
<link rel="stylesheet" href="styles.css">
<style>
.gallery-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem;
  max-width: 1200px; margin: 3rem auto; padding: 0 4vw;
}
.gallery-card {
  border: 2px solid var(--gold); border-radius: 8px; overflow: hidden;
  background: var(--night-2); box-shadow: 0 10px 20px rgba(0,0,0,0.4);
}
.gallery-card img { width: 100%; height: 250px; object-fit: cover; }
.gallery-card p { padding: 0.8rem; text-align: center; font-family: var(--font-serif); color: var(--gold); }
</style>
</head>
<body style="padding-top: 100px;">

<section style="text-align: center;">
  <h1 style="font-family: var(--font-display); color: var(--gold-bright); font-size: 3rem;">Conference Gallery</h1>
  <p style="color: var(--ivory-dim); font-family: var(--font-serif);">Captured Moments of Diplomacy and Debate</p>
</section>

<div class="gallery-grid">
  <div class="gallery-card">
    <img src="WhatsApp Image 2026-08-22 at 23.53.38.jpeg" alt="AFGJI MUN Hall">
    <p>Opening Ceremony Assembly</p>
  </div>
  <div class="gallery-card">
    <img src="" alt="Gallery Image 2 Placeholder">
    <p>Committee Deliberation</p>
  </div>
  <div class="gallery-card">
    <img src="" alt="Gallery Image 3 Placeholder">
    <p>Executive Board Session</p>
  </div>
</div>

</body>
</html>
