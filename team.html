<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Team — NAVDOOT 1.0</title>
<link rel="stylesheet" href="styles.css">
<style>
.profile-card {
  width: 260px; background: var(--night-2); border: 1px solid var(--gold);
  border-radius: 12px; overflow: hidden; text-align: center; padding-bottom: 1rem;
  transition: transform 0.3s;
}
.profile-card:hover { transform: translateY(-8px); }
.profile-frame {
  width: 100%; height: 280px; background: var(--night-3); overflow: hidden;
  border-bottom: 1px solid var(--line); position: relative;
}
.profile-frame img {
  width: 100%; height: 100%; object-fit: cover; object-position: center;
}
</style>
</head>
<body style="padding-top: 100px;">

<section style="text-align: center; padding: 2rem 0;">
  <h1 style="font-family: var(--font-display); color: var(--gold-bright); font-size: 3rem;">Our Secretariat & Faculty</h1>
  <p style="color: var(--ivory-dim); font-family: var(--font-serif);">The Leadership Behind NAVDOOT 1.0</p>
</section>

<div style="display: flex; justify-content: center; gap: 2rem; flex-wrap: wrap; max-width: 1200px; margin: 2rem auto; padding: 0 4vw;">
  <!-- Member 1 -->
  <div class="profile-card">
    <div class="profile-frame">
      <img src="" alt="Faculty Head Placeholder">
    </div>
    <h3 style="color: var(--gold); margin-top: 0.8rem; font-family: var(--font-serif);">Ms. Priya Mathur</h3>
    <p style="font-size: 0.85rem; color: var(--ivory-dim);">HOD, Social Science</p>
  </div>

  <!-- Member 2 -->
  <div class="profile-card">
    <div class="profile-frame">
      <img src="" alt="Sec Gen Placeholder">
    </div>
    <h3 style="color: var(--gold); margin-top: 0.8rem; font-family: var(--font-serif);">Avaneesh Shankar</h3>
    <p style="font-size: 0.85rem; color: var(--ivory-dim);">Secretary General</p>
  </div>

  <!-- Member 3 -->
  <div class="profile-card">
    <div class="profile-frame">
      <img src="" alt="Deputy Sec Gen Placeholder">
    </div>
    <h3 style="color: var(--gold); margin-top: 0.8rem; font-family: var(--font-serif);">Aditya Kumar Pandey</h3>
    <p style="font-size: 0.85rem; color: var(--ivory-dim);">Deputy Secretary General</p>
  </div>
</div>

</body>
</html>
